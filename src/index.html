<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>woGAer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      margin: 0;
      transition: background 0.6s ease, color 0.6s ease;
      background: radial-gradient(ellipse at 30% 20%, #e6ecf5, #c0c8d8);
      color: #111;
      font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    }
    body.dark {
      background: radial-gradient(ellipse at 30% 20%, #1e2338, #0a0c14);
      color: #fff;
    }
    .glass {
      position: relative;
      width: 100%;
      max-width: 920px;
      padding: 52px 44px 44px 44px;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(32px) saturate(1.8);
      -webkit-backdrop-filter: blur(32px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 0 80px rgba(200, 220, 255, 0.2);
      overflow: hidden;
      transition: background 0.6s, backdrop-filter 0.6s, border-color 0.6s, box-shadow 0.6s;
    }
    body.dark .glass {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.03), inset 0 0 80px rgba(120, 180, 255, 0.02);
    }
    .glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 60px;
      background: radial-gradient(ellipse at 10% 20%, rgba(255, 255, 255, 0.4), transparent 50%), radial-gradient(ellipse at 90% 80%, rgba(180, 200, 255, 0.2), transparent 40%), radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.05), transparent 70%);
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.6s;
    }
    body.dark .glass::before {
      background: radial-gradient(ellipse at 10% 20%, rgba(255, 255, 255, 0.12), transparent 50%), radial-gradient(ellipse at 90% 80%, rgba(180, 200, 255, 0.08), transparent 40%), radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.02), transparent 70%);
    }
    .glass::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 63px;
      padding: 3px;
      background: conic-gradient(from 0deg, rgba(60, 100, 180, 0.2), rgba(100, 140, 200, 0.08), rgba(80, 60, 160, 0.15), rgba(60, 100, 180, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
      animation: flowBorder 12s linear infinite;
      z-index: 0;
      transition: opacity 0.6s;
    }
    body.dark .glass::after {
      background: conic-gradient(from 0deg, rgba(180, 210, 255, 0.15), rgba(120, 160, 255, 0.04), rgba(200, 170, 255, 0.12), rgba(180, 210, 255, 0.15));
    }
    @keyframes flowBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .content {
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #1a2a4a 10%, #3a5a8a 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      transition: background 0.6s;
    }
    body.dark .title {
      background: linear-gradient(135deg, #f2f6ff 10%, #b8d0ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub {
      font-size: 15px;
      font-weight: 400;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.6px;
      margin-bottom: 36px;
      transition: color 0.6s;
    }
    body.dark .sub {
      color: rgba(255, 255, 255, 0.3);
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn {
      position: relative;
      z-index: 2;
      display: inline-block;
      padding: 14px 38px;
      border: none;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      color: #1a1a2e;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, box-shadow 0.35s ease, color 0.6s, border-color 0.6s;
      will-change: transform;
      letter-spacing: 0.2px;
      overflow: hidden;
    }
    body.dark .btn {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .btn:hover {
      transform: scale(1.04) translateY(-2px);
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 12px 48px rgba(60, 100, 200, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    body.dark .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 48px rgba(80, 140, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .btn:active {
      transform: scale(0.94) translateY(2px);
      transition-duration: 0.08s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .btn-primary {
      background: rgba(60, 120, 220, 0.15);
      border-color: rgba(60, 120, 220, 0.2);
    }
    body.dark .btn-primary {
      background: rgba(100, 160, 255, 0.12);
      border-color: rgba(160, 200, 255, 0.08);
    }
    .btn-primary:hover {
      background: rgba(60, 120, 220, 0.25);
      border-color: rgba(60, 120, 220, 0.3);
    }
    body.dark .btn-primary:hover {
      background: rgba(100, 160, 255, 0.18);
      border-color: rgba(160, 200, 255, 0.15);
    }
    .btn .btn-glass {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      border-radius: inherit;
      overflow: hidden;
    }
    .btn .btn-text {
      position: relative;
      z-index: 6;
      display: inline-block;
    }
    .drop-zone {
      position: relative;
      z-index: 2;
      padding: 44px 20px;
      border: 2px dashed rgba(0, 0, 0, 0.1);
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      text-align: center;
      color: rgba(0, 0, 0, 0.3);
      font-size: 14px;
      transition: background 0.3s, border-color 0.3s, color 0.6s;
      cursor: default;
    }
    body.dark .drop-zone {
      color: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.01);
    }
    .drop-zone.dragover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(60, 120, 220, 0.3);
    }
    body.dark .drop-zone.dragover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(160, 200, 255, 0.15);
    }
    .drop-zone strong {
      color: rgba(0, 0, 0, 0.5);
      font-weight: 500;
    }
    body.dark .drop-zone strong {
      color: rgba(255, 255, 255, 0.4);
    }
    .paused .glass::after {
      animation-play-state: paused;
    }
    #pyramid-host {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      border-radius: 60px;
      overflow: hidden;
      transition: opacity 0.6s;
    }
    body.dark #pyramid-host {
      opacity: 1;
    }
    #pyramid-host {
      opacity: 0.6;
    }
    body.dark #pyramid-host {
      opacity: 1;
    }
    .top-right {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .theme-toggle, .lang-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s, border-color 0.3s;
      color: #1a1a2e;
      user-select: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      font-weight: 500;
    }
    body.dark .theme-toggle, body.dark .lang-toggle {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .theme-toggle:hover, .lang-toggle:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.6);
    }
    body.dark .theme-toggle:hover, body.dark .lang-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .bottom-right {
      position: fixed;
      bottom: 12px;
      right: 16px;
      z-index: 20;
      font-size: 9px;
      text-align: right;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.2);
      transition: color 0.6s;
      pointer-events: none;
      letter-spacing: 0.2px;
    }
    body.dark .bottom-right {
      color: rgba(255, 255, 255, 0.2);
    }
    .bottom-right a {
      color: inherit;
      text-decoration: none;
      pointer-events: auto;
      border-bottom: 1px dotted rgba(0, 0, 0, 0.1);
    }
    body.dark .bottom-right a {
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    .bottom-right a:hover {
      color: rgba(0, 0, 0, 0.5);
    }
    body.dark .bottom-right a:hover {
      color: rgba(255, 255, 255, 0.5);
    }
    @media (max-width: 600px) {
      .glass { padding: 32px 20px; border-radius: 36px; }
      .title { font-size: 28px; }
      .btn { padding: 12px 24px; font-size: 13px; }
      .btn-group { gap: 8px; }
      .top-right { top: 12px; right: 14px; gap: 6px; }
      .theme-toggle, .lang-toggle { width: 32px; height: 32px; font-size: 15px; }
      .bottom-right { font-size: 8px; bottom: 8px; right: 10px; }
    }
  </style>
</head>
<body class="light">
  <div class="glass" id="glass">
    <div id="pyramid-host"></div>
    <div class="top-right">
      <div class="lang-toggle" id="langToggle">中</div>
      <div class="theme-toggle" id="themeToggle">☽</div>
    </div>
    <div class="content">
      <div class="title" id="appTitle">woGAer</div>
      <div class="sub" id="appSub">GitHub Actions · 液态构建工坊</div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnPick">
          <span class="btn-text" id="btnPickText">选择项目</span>
          <span class="btn-glass"></span>
        </button>
        <button class="btn" id="btnSettings">
          <span class="btn-text" id="btnSettingsText">设置</span>
          <span class="btn-glass"></span>
        </button>
        <button class="btn" id="btnHistory">
          <span class="btn-text" id="btnHistoryText">历史</span>
          <span class="btn-glass"></span>
        </button>
      </div>
      <div class="drop-zone" id="dropZone">
        <strong id="dropStrong">拖拽项目文件夹至此</strong><br />
        <span id="dropHint">或点击上方「选择项目」浏览</span>
      </div>
    </div>
  </div>

  <div class="bottom-right" id="bottomInfo">
    <div id="versionLine">版本号：0.1.0</div>
    <div><a href="https://github.com/Wojusensei/woGAer" target="_blank">github.com/Wojusensei/woGAer</a></div>
    <div id="descLine">高性能 GitHub Actions 自动化打包工具</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@tauri-apps/api": "https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/index.js"
      }
    }
  </script>

  <script type="module">
    import { getVersion } from '@tauri-apps/api/app';
    try {
      const version = await getVersion();
      document.getElementById('versionLine').textContent = '版本号：' + version;
    } catch {
      // 保持默认
    }
  </script>

  <script>
    (function() {
      'use strict';

      // ---- 主题与语言控制 ----
      const body = document.body;
      const themeToggle = document.getElementById('themeToggle');
      const langToggle = document.getElementById('langToggle');

      const translations = {
        zh: {
          title: 'woGAer',
          sub: 'GitHub Actions · 液态构建工坊',
          btnPick: '选择项目',
          btnSettings: '设置',
          btnHistory: '历史',
          dropStrong: '拖拽项目文件夹至此',
          dropHint: '或点击上方「选择项目」浏览',
          desc: '高性能 GitHub Actions 自动化打包工具',
          versionPrefix: '版本号：'
        },
        en: {
          title: 'woGAer',
          sub: 'GitHub Actions · Liquid Build Studio',
          btnPick: 'Select Project',
          btnSettings: 'Settings',
          btnHistory: 'History',
          dropStrong: 'Drag your project folder here',
          dropHint: 'or click "Select Project" above',
          desc: 'High-performance GitHub Actions automation packaging tool',
          versionPrefix: 'version: '
        }
      };

      let currentLang = 'zh';
      let isDark = false;

      function applyLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('appTitle').textContent = t.title;
        document.getElementById('appSub').textContent = t.sub;
        document.getElementById('btnPickText').textContent = t.btnPick;
        document.getElementById('btnSettingsText').textContent = t.btnSettings;
        document.getElementById('btnHistoryText').textContent = t.btnHistory;
        document.getElementById('dropStrong').textContent = t.dropStrong;
        document.getElementById('dropHint').textContent = t.dropHint;
        document.getElementById('descLine').textContent = t.desc;
        // 更新版本号前缀
        const versionEl = document.getElementById('versionLine');
        const currentVersion = versionEl.textContent.replace(/^版本号：|^version: /, '');
        versionEl.textContent = t.versionPrefix + currentVersion;
        langToggle.textContent = lang === 'zh' ? '中' : 'EN';
      }

      function toggleTheme() {
        isDark = !isDark;
        body.classList.toggle('dark', isDark);
        themeToggle.textContent = isDark ? '☀' : '☽';
      }

      function toggleLang() {
        const next = currentLang === 'zh' ? 'en' : 'zh';
        applyLanguage(next);
      }

      themeToggle.addEventListener('click', toggleTheme);
      langToggle.addEventListener('click', toggleLang);

      // 初始状态：亮色+中文
      body.classList.remove('dark');
      body.classList.add('light');
      themeToggle.textContent = '☽';
      applyLanguage('zh');


      // ===== liquid-diamond.js (背景) =====
      (function() {
        if (window.attachLiquidPyramid) return;

        var glassEl = document.getElementById('glass');
        var rect = glassEl.getBoundingClientRect();
        var BASE_W = Math.min(rect.width, 920);
        var BASE_H = Math.min(rect.height, 600);

        var VIEWPORT_SCALE = Math.min(BASE_W / 220, BASE_H / 220) * 1.7;
        var CAMERA = [0, 0.08, 4.2];
        var BACKGROUND_Z = -5.5;
        var IOR = 1.18;
        var MAX_DISTANCE = 12;
        var SURFACE_OFFSET = 0.008;
        var MIN_BACKGROUND_Z_COMPONENT = 0.08;
        var MAX_UV_OFFSET = 2;
        var MAX_EFFECTIVE_UV_OFFSET = 0.32;
        var MAX_INTERNAL_BOUNCES = 8;
        var EDGE_BULGE_PX = 20;
        var EDGE_BULGE_STRENGTH = 0.04;
        var CANVAS_DPI = 1.25;
        var DRAG_ELASTIC = 0.16;
        var VELOCITY_DAMPING = 0.94;
        var BOUND_SPRING = 0.014;
        var BOUND_DAMPING = 0.82;
        var THETA_PER_PX = 0.0125;
        var PHI_PER_PX = 0.01;
        var PHI_MIN = -1.35;
        var PHI_MAX = 1.35;

        function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
        function texture(x, y) { return [x, y]; }
        function add3(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
        function sub3(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
        function mul3(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
        function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
        function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
        function length3(v) { return Math.hypot(v[0], v[1], v[2]); }
        function normalize3(v) { var l = length3(v); if (!l) return [0,0,0]; return [v[0]/l, v[1]/l, v[2]/l]; }
        function softClampSigned(val, limit) { if (Math.abs(val) <= limit) return val; return limit * Math.tanh(val / limit); }
        function stabilizeBackgroundDirection(d, minZ) { if (d[2] <= -minZ) return d; return normalize3([d[0], d[1], -minZ]); }

        function buildDisplacementTrace(uv, origin, dir, entry, exit) {
          var stableDir = stabilizeBackgroundDirection(dir, MIN_BACKGROUND_Z_COMPONENT);
          var hit = traceToPlane(origin, stableDir, BACKGROUND_Z);
          if (!hit) return { displacedUv: { x: uv.x, y: uv.y } };
          var duv = screenPointToUv(hit);
          var ox = duv.x - uv.x, oy = duv.y - uv.y;
          ox = clamp(ox, -MAX_UV_OFFSET, MAX_UV_OFFSET);
          oy = clamp(oy, -MAX_UV_OFFSET, MAX_UV_OFFSET);
          var strength = clamp(0.9 + length3(sub3(exit || entry, entry)) * 0.14, 0.85, 1.25);
          return {
            displacedUv: {
              x: uv.x + softClampSigned(ox * strength, MAX_EFFECTIVE_UV_OFFSET),
              y: uv.y + softClampSigned(oy * strength, MAX_EFFECTIVE_UV_OFFSET)
            }
          };
        }

        function rotatePointWithTransform(p, t) {
          var yx = p[0] * t.thetaCos + p[2] * t.thetaSin;
          var yz = -p[0] * t.thetaSin + p[2] * t.thetaCos;
          return [ yx, p[1] * t.phiCos - yz * t.phiSin, p[1] * t.phiSin + yz * t.phiCos ];
        }
        function inverseRotatePointWithTransform(p, t) {
          var xx = p[0];
          var xy = p[1] * t.phiCos + p[2] * t.phiSin;
          var xz = -p[1] * t.phiSin + p[2] * t.phiCos;
          return [ xx * t.thetaCos - xz * t.thetaSin, xy, xx * t.thetaSin + xz * t.thetaCos ];
        }

        function createPlane(a, b, c, interior) {
          var n = normalize3(cross3(sub3(b, a), sub3(c, a)));
          if (dot3(sub3(interior, a), n) > 0) n = mul3(n, -1);
          return { point: a, normal: n };
        }
        function scaleVertices(v, s) {
          return { apex: mul3(v.apex, s), base: v.base.map(function(p) { return mul3(p, s); }) };
        }

        var BASE_PYRAMID = { apex: [0,1.18,0], base: [[-1.04,-0.92,-1.04],[1.04,-0.92,-1.04],[1.04,-0.92,1.04],[-1.04,-0.92,1.04]] };
        var SHAPE_SCALE = 0.9;
        var PYRAMID_VERTICES = scaleVertices(BASE_PYRAMID, SHAPE_SCALE);
        var PYRAMID_INTERIOR = mul3([0,-0.3,0], SHAPE_SCALE);
        var PYRAMID_PLANES = [
          createPlane(PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[0], PYRAMID_VERTICES.base[1], PYRAMID_INTERIOR),
          createPlane(PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[1], PYRAMID_VERTICES.base[2], PYRAMID_INTERIOR),
          createPlane(PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[2], PYRAMID_VERTICES.base[3], PYRAMID_INTERIOR),
          createPlane(PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[3], PYRAMID_VERTICES.base[0], PYRAMID_INTERIOR),
          createPlane(PYRAMID_VERTICES.base[0], PYRAMID_VERTICES.base[3], PYRAMID_VERTICES.base[2], PYRAMID_INTERIOR)
        ];
        var PYRAMID_FACES = [
          { vertices: [PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[0], PYRAMID_VERTICES.base[1]], normal: PYRAMID_PLANES[0].normal },
          { vertices: [PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[1], PYRAMID_VERTICES.base[2]], normal: PYRAMID_PLANES[1].normal },
          { vertices: [PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[2], PYRAMID_VERTICES.base[3]], normal: PYRAMID_PLANES[2].normal },
          { vertices: [PYRAMID_VERTICES.apex, PYRAMID_VERTICES.base[3], PYRAMID_VERTICES.base[0]], normal: PYRAMID_PLANES[3].normal },
          { vertices: [PYRAMID_VERTICES.base[0], PYRAMID_VERTICES.base[1], PYRAMID_VERTICES.base[2]], normal: PYRAMID_PLANES[4].normal },
          { vertices: [PYRAMID_VERTICES.base[0], PYRAMID_VERTICES.base[2], PYRAMID_VERTICES.base[3]], normal: PYRAMID_PLANES[4].normal }
        ];

        function intersectRayTriangle(origin, dir, a, b, c, normal) {
          var e1 = sub3(b, a), e2 = sub3(c, a);

        }
        function length(x, y) { return Math.hypot(x, y); }
        function roundedRectSDF(x, y, w, h, r) {
          var qx = Math.abs(x) - w + r;
          var qy = Math.abs(y) - h + r;
          return Math.min(Math.max(qx, qy), 0) + length(Math.max(qx, 0), Math.max(qy, 0)) - r;
        }
        function texture(x, y) { return { type: 't', x: x, y: y }; }
        function generateId() { return 'btn-glass-' + Math.random().toString(36).substr(2, 9); }

        var ButtonGlass = function(options) {
          options = options || {};
          this.width = options.width || 100;
          this.height = options.height || 40;
          this.container = options.container || document.body;
          this.fragment = options.fragment || function(uv, mouse) {
            var ix = uv.x - 0.5;
            var iy = uv.y - 0.5;
            var dist = roundedRectSDF(ix, iy, 0.45, 0.25, 0.6);
            var disp = smoothStep(0.8, 0, dist - 0.15);
            var scaled = smoothStep(0, 1, disp);
            var strength = 0.35;
            var mx = mouse.x - 0.5;
            var my = mouse.y - 0.5;
            var influence = 1 - smoothStep(0.1, 0.4, Math.hypot(mx, my));
            var effective = scaled * strength * (0.5 + 0.5 * influence);
            return texture(ix * effective * 1.2 + 0.5, iy * effective * 1.2 + 0.5);
          };
          this.canvasDPI = 1;
          this.id = generateId();
          this.mouse = { x: 0.5, y: 0.5 };
          this.mouseUsed = false;
          this.createElement();
          this.setupEventListeners();
          this.updateShader();
        };

        ButtonGlass.prototype.createElement = function() {
          var self = this;
          this.wrapper = document.createElement('div');
          this.wrapper.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:inherit;overflow:hidden;';
          this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          this.svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          this.svg.setAttribute('width', '0');
          this.svg.setAttribute('height', '0');
          this.svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:5;';
          var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
          var filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
          filter.setAttribute('id', this.id + '_filter');
          filter.setAttribute('filterUnits', 'userSpaceOnUse');
          filter.setAttribute('color-interpolation-filters', 'sRGB');
          filter.setAttribute('x', '0');
          filter.setAttribute('y', '0');
          filter.setAttribute('width', String(this.width));
          filter.setAttribute('height', String(this.height));
          this.feImage = document.createElementNS('http://www.w3.org/2000/svg', 'feImage');
          this.feImage.setAttribute('id', this.id + '_map');
          this.feImage.setAttribute('width', String(this.width));
          this.feImage.setAttribute('height', String(this.height));
          this.feDisplacementMap = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
          this.feDisplacementMap.setAttribute('in', 'SourceGraphic');
          this.feDisplacementMap.setAttribute('in2', this.id + '_map');
          this.feDisplacementMap.setAttribute('xChannelSelector', 'R');
          this.feDisplacementMap.setAttribute('yChannelSelector', 'G');
          filter.appendChild(this.feImage);
          filter.appendChild(this.feDisplacementMap);
          defs.appendChild(filter);
          this.svg.appendChild(defs);
          this.canvas = document.createElement('canvas');
          this.canvas.width = this.width * this.canvasDPI;
          this.canvas.height = this.height * this.canvasDPI;
          this.canvas.style.display = 'none';
          this.context = this.canvas.getContext('2d');
        };

        ButtonGlass.prototype.setupEventListeners = function() {
          var self = this;
          function onMove(e) {
            var rect = self.wrapper.getBoundingClientRect();
            self.mouse.x = (e.clientX - rect.left) / rect.width;
            self.mouse.y = (e.clientY - rect.top) / rect.height;
            self.mouseUsed = true;
            self.updateShader();
          }
          this.wrapper.addEventListener('mousemove', onMove);
          this.wrapper.addEventListener('mouseenter', function() { self.mouseUsed = true; });
          this.wrapper.addEventListener('mouseleave', function() {
            self.mouseUsed = false;
            self.mouse.x = 0.5;
            self.mouse.y = 0.5;
            self.updateShader();
          });
        };

        ButtonGlass.prototype.updateShader = function() {
          var self = this;
          var mouseProxy = new Proxy(this.mouse, {
            get: function(target, prop) {
              if (prop === 'x' || prop === 'y') self.mouseUsed = true;
              return target[prop];
            }
          });

          var w = this.canvas.width, h = this.canvas.height;
          var data = new Uint8ClampedArray(w * h * 4);
          var maxScale = 0;
          var rawValues = [];

          for (var i = 0; i < data.length; i += 4) {
            var x = (i / 4) % w;
            var y = Math.floor(i / 4 / w);
            var pos = this.fragment({ x: x / w, y: y / h }, mouseProxy);
            var dx = pos.x * w - x;
            var dy = pos.y * h - y;
            if (Math.abs(dx) > maxScale) maxScale = Math.abs(dx);
            if (Math.abs(dy) > maxScale) maxScale = Math.abs(dy);
            rawValues.push(dx, dy);
          }

          maxScale = Math.max(maxScale, 0.1);
          var idx = 0;
          for (var j = 0; j < data.length; j += 4) {
            var r = rawValues[idx++] / (maxScale * 2) + 0.5;
            var g = rawValues[idx++] / (maxScale * 2) + 0.5;
            data[j] = r * 255;
            data[j+1] = g * 255;
            data[j+2] = 0;
            data[j+3] = 255;
          }

          this.context.putImageData(new ImageData(data, w, h), 0, 0);
          this.feImage.setAttributeNS('http://www.w3.org/1999/xlink', 'href', this.canvas.toDataURL());
          this.feDisplacementMap.setAttribute('scale', String((maxScale * 2) / this.canvasDPI));
        };

        ButtonGlass.prototype.appendTo = function(parent) {
          parent.appendChild(this.svg);
          parent.appendChild(this.wrapper);
        };
        ButtonGlass.prototype.destroy = function() {
          this.svg.remove();
          this.wrapper.remove();
          this.canvas.remove();
        };

        function attachButtonGlass(buttonElement) {
          var rect = buttonElement.getBoundingClientRect();
          var w = rect.width || 100;
          var h = rect.height || 40;
          var glass = new ButtonGlass({
            width: w,
            height: h,
            container: buttonElement,
            fragment: function(uv, mouse) {
              var ix = uv.x - 0.5;
              var iy = uv.y - 0.5;
              var dist = roundedRectSDF(ix, iy, 0.45, 0.25, 0.6);
              var disp = smoothStep(0.8, 0, dist - 0.15);
              var scaled = smoothStep(0, 1, disp);
              var strength = 0.35;
              var mx = mouse.x - 0.5;
              var my = mouse.y - 0.5;
              var influence = 1 - smoothStep(0.1, 0.4, Math.hypot(mx, my));
              var effective = scaled * strength * (0.5 + 0.5 * influence);
              return texture(ix * effective * 1.2 + 0.5, iy * effective * 1.2 + 0.5);
            }
          });
          glass.appendTo(buttonElement);
          return glass;
        }

        window.attachButtonGlass = attachButtonGlass;

        document.querySelectorAll('.btn').forEach(function(btn) {
          var glassEl = btn.querySelector('.btn-glass');
          if (!glassEl) return;
          attachButtonGlass(glassEl);
        });
      })();


      // ===== 基础交互 =====
      (function() {
        var dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', function(e) {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', function() {
          dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', function(e) {
          e.preventDefault();
          dropZone.classList.remove('dragover');
          var items = e.dataTransfer.items;
          if (items.length > 0) {
            var entry = items[0].webkitGetAsEntry();
            if (entry && entry.isDirectory) {
              dropZone.innerHTML = '<strong>已选择文件夹</strong><br />' + (entry.fullPath || entry.name);
            }
          }
        });

        document.getElementById('btnPick').addEventListener('click', function() {});
        document.getElementById('btnSettings').addEventListener('click', function() {});
        document.getElementById('btnHistory').addEventListener('click', function() {});

        var glass = document.getElementById('glass');
        var isPaused = false;
        function updatePauseState() {
          var paused = document.hidden;
          if (paused !== isPaused) {
            isPaused = paused;
            document.body.classList.toggle('paused', paused);
          }
        }
        document.addEventListener('visibilitychange', updatePauseState);
        updatePauseState();

        console.log('woGAer UI ready');
      })();
    })();
  </script>
</body>
