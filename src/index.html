<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>woGAer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      margin: 0;
      transition: background 0.6s ease, color 0.6s ease;
      background: radial-gradient(ellipse at 30% 20%, #e6ecf5, #c0c8d8);
      color: #111;
      font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    }
    body.dark {
      background: radial-gradient(ellipse at 30% 20%, #1e2338, #0a0c14);
      color: #fff;
    }
    .glass {
      position: relative;
      width: 100%;
      max-width: 920px;
      padding: 52px 44px 44px 44px;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(32px) saturate(1.8);
      -webkit-backdrop-filter: blur(32px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 0 80px rgba(200, 220, 255, 0.2);
      overflow: hidden;
      transition: background 0.6s, backdrop-filter 0.6s, border-color 0.6s, box-shadow 0.6s;
    }
    body.dark .glass {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.03), inset 0 0 80px rgba(120, 180, 255, 0.02);
    }
    .glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 60px;
      background: radial-gradient(ellipse at 10% 20%, rgba(255, 255, 255, 0.4), transparent 50%), radial-gradient(ellipse at 90% 80%, rgba(180, 200, 255, 0.2), transparent 40%), radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.05), transparent 70%);
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.6s;
    }
    body.dark .glass::before {
      background: radial-gradient(ellipse at 10% 20%, rgba(255, 255, 255, 0.12), transparent 50%), radial-gradient(ellipse at 90% 80%, rgba(180, 200, 255, 0.08), transparent 40%), radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.02), transparent 70%);
    }
    .glass::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 63px;
      padding: 3px;
      background: conic-gradient(from 0deg, rgba(60, 100, 180, 0.2), rgba(100, 140, 200, 0.08), rgba(80, 60, 160, 0.15), rgba(60, 100, 180, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
      animation: flowBorder 12s linear infinite;
      z-index: 0;
      transition: opacity 0.6s;
    }
    body.dark .glass::after {
      background: conic-gradient(from 0deg, rgba(180, 210, 255, 0.15), rgba(120, 160, 255, 0.04), rgba(200, 170, 255, 0.12), rgba(180, 210, 255, 0.15));
    }
    @keyframes flowBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .content {
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #1a2a4a 10%, #3a5a8a 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      transition: background 0.6s;
    }
    body.dark .title {
      background: linear-gradient(135deg, #f2f6ff 10%, #b8d0ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub {
      font-size: 15px;
      font-weight: 400;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.6px;
      margin-bottom: 36px;
      transition: color 0.6s;
    }
    body.dark .sub {
      color: rgba(255, 255, 255, 0.3);
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn {
      position: relative;
      z-index: 2;
      display: inline-block;
      padding: 14px 38px;
      border: none;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      color: #1a1a2e;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, box-shadow 0.35s ease, color 0.6s, border-color 0.6s;
      will-change: transform;
      letter-spacing: 0.2px;
      overflow: hidden;
    }
    body.dark .btn {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .btn:hover {
      transform: scale(1.04) translateY(-2px);
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 12px 48px rgba(60, 100, 200, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    body.dark .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 48px rgba(80, 140, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .btn:active {
      transform: scale(0.94) translateY(2px);
      transition-duration: 0.08s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .btn-primary {
      background: rgba(60, 120, 220, 0.15);
      border-color: rgba(60, 120, 220, 0.2);
    }
    body.dark .btn-primary {
      background: rgba(100, 160, 255, 0.12);
      border-color: rgba(160, 200, 255, 0.08);
    }
    .btn-primary:hover {
      background: rgba(60, 120, 220, 0.25);
      border-color: rgba(60, 120, 220, 0.3);
    }
    body.dark .btn-primary:hover {
      background: rgba(100, 160, 255, 0.18);
      border-color: rgba(160, 200, 255, 0.15);
    }
    .btn .btn-glass {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      border-radius: inherit;
      overflow: hidden;
    }
    .btn .btn-text {
      position: relative;
      z-index: 6;
      display: inline-block;
    }
    .drop-zone {
      position: relative;
      z-index: 2;
      padding: 44px 20px;
      border: 2px dashed rgba(0, 0, 0, 0.1);
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      text-align: center;
      color: rgba(0, 0, 0, 0.3);
      font-size: 14px;
      transition: background 0.3s, border-color 0.3s, color 0.6s;
      cursor: default;
    }
    body.dark .drop-zone {
      color: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.01);
    }
    .drop-zone.dragover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(60, 120, 220, 0.3);
    }
    body.dark .drop-zone.dragover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(160, 200, 255, 0.15);
    }
    .drop-zone strong {
      color: rgba(0, 0, 0, 0.5);
      font-weight: 500;
    }
    body.dark .drop-zone strong {
      color: rgba(255, 255, 255, 0.4);
    }
    .paused .glass::after {
      animation-play-state: paused;
    }
    #pyramid-host {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      border-radius: 60px;
      overflow: hidden;
      transition: opacity 0.6s;
    }
    #pyramid-host {
      opacity: 0.6;
    }
    body.dark #pyramid-host {
      opacity: 1;
    }
    .top-right {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .theme-toggle,
    .lang-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s, border-color 0.3s;
      color: #1a1a2e;
      user-select: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      font-weight: 500;
    }
    body.dark .theme-toggle,
    body.dark .lang-toggle {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .theme-toggle:hover,
    .lang-toggle:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.6);
    }
    body.dark .theme-toggle:hover,
    body.dark .lang-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      color: #1a1a2e;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: background 0.3s, transform 0.3s, border-color 0.3s;
    }
    body.dark .user-avatar {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .user-avatar:hover {
      transform: scale(1.08);
    }
    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .user-avatar img[hidden],
    .user-avatar img:not([src]),
    .user-avatar img[src=""] {
      display: none;
    }
    .avatar-placeholder {
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      color: rgba(0, 0, 0, 0.4);
    }
    body.dark .avatar-placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .user-menu {
      position: absolute;
      top: 52px;
      right: 0;
      z-index: 120;
      min-width: 190px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(30, 30, 50, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    body.light .user-menu {
      background: rgba(245, 245, 250, 0.95);
      color: #111;
      border-color: rgba(0, 0, 0, 0.1);
    }
    .user-menu[hidden] {
      display: none;
    }
    .user-menu-name {
      padding: 8px 12px;
      font-size: 13px;
      opacity: 0.85;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    body.light .user-menu-name {
      border-bottom-color: rgba(0, 0, 0, 0.08);
    }
    .user-menu button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    .user-menu button:hover {
      background: rgba(255, 60, 60, 0.15);
    }
    .bottom-right {
      position: fixed;
      bottom: 12px;
      right: 16px;
      z-index: 20;
      font-size: 9px;
      text-align: right;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.2);
      transition: color 0.6s;
      pointer-events: none;
      letter-spacing: 0.2px;
    }
    body.dark .bottom-right {
      color: rgba(255, 255, 255, 0.2);
    }
    .bottom-right a {
      color: inherit;
      text-decoration: none;
      pointer-events: auto;
      border-bottom: 1px dotted rgba(0, 0, 0, 0.1);
    }
    body.dark .bottom-right a {
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    .bottom-right a:hover {
      color: rgba(0, 0, 0, 0.5);
    }
    body.dark .bottom-right a:hover {
      color: rgba(255, 255, 255, 0.5);
    }
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .settings-overlay.active {
      display: flex;
    }
    .settings-panel {
      background: rgba(30, 30, 50, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px 36px;
      max-width: 440px;
      width: 90%;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    body.light .settings-panel {
      background: rgba(240, 240, 250, 0.9);
      color: #111;
      border-color: rgba(0, 0, 0, 0.1);
    }
    .settings-panel h2 {
      font-weight: 500;
      margin-bottom: 24px;
      font-size: 22px;
      letter-spacing: -0.3px;
    }
    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    body.light .settings-item {
      border-bottom-color: rgba(0, 0, 0, 0.06);
    }
    .settings-item:last-child {
      border-bottom: none;
    }
    .settings-item label {
      font-size: 14px;
      opacity: 0.8;
    }
    .settings-item input,
    .settings-item select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 12px;
      color: inherit;
      font-size: 13px;
      width: 160px;
      outline: none;
    }
    body.light .settings-item input,
    body.light .settings-item select {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.15);
    }
    .settings-actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .settings-actions button {
      padding: 8px 24px;
      border: none;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    body.light .settings-actions button {
      background: rgba(0, 0, 0, 0.05);
      color: #111;
    }
    .settings-actions button:hover {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.2);
    }
    body.light .settings-actions button:hover {
      background: rgba(0, 0, 0, 0.1);
    }
    .settings-actions .primary {
      background: rgba(60, 120, 220, 0.6);
      color: #fff;
    }
    .settings-actions .primary:hover {
      background: rgba(60, 120, 220, 0.8);
    }
    .settings-error {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #ff6b6b;
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.2);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .settings-error[hidden] {
      display: none;
    }
    .settings-hint {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .login-guide {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    body.light .login-guide {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.08);
    }
    .guide-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .guide-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 12px;
      opacity: 0.85;
    }
    .guide-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      background: rgba(60, 120, 220, 0.18);
      border: 1px solid rgba(60, 120, 220, 0.25);
    }
    .guide-actions {
      margin-top: 10px;
      display: flex;
    }
    .guide-actions button,
    .advanced-toggle {
      padding: 8px 18px;
      border: none;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(60, 120, 220, 0.18);
      color: inherit;
    }
    .guide-actions button:hover,
    .advanced-toggle:hover {
      background: rgba(60, 120, 220, 0.3);
    }
    .advanced-login {
      margin-top: 14px;
    }
    .advanced-toggle {
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    body.light .advanced-toggle {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.08);
    }
    .advanced-body {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    body.light .advanced-body {
      background: rgba(0, 0, 0, 0.02);
      border-color: rgba(0, 0, 0, 0.07);
    }
    .advanced-body[hidden] {
      display: none;
    }
    .device-flow {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    body.light .device-flow {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.1);
    }
    .device-flow[hidden] {
      display: none;
    }
    .device-code {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 4px;
      margin: 6px 0;
    }
    .device-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .device-actions button {
      padding: 6px 14px;
      border: none;
      border-radius: 100px;
      font-size: 12px;
      cursor: pointer;
      background: rgba(60, 120, 220, 0.18);
      color: inherit;
    }
    .status-bar {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(420px, calc(100vw - 32px));
      pointer-events: none;
    }
    .status-msg {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      background: rgba(30, 30, 50, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      animation: statusIn 0.25s ease;
    }
    body.light .status-msg {
      background: rgba(245, 245, 250, 0.95);
      color: #111;
    }
    .status-msg.success {
      border-left: 3px solid #3ecf8e;
    }
    .status-msg.error {
      border-left: 3px solid #ff6b6b;
    }
    .status-msg.info {
      border-left: 3px solid #f5c542;
    }
    .status-msg.fade-out {
      animation: statusOut 0.4s ease forwards;
    }
    @keyframes statusIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes statusOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(8px); }
    }
    .status-action {
      padding: 5px 12px;
      border: none;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(60, 120, 220, 0.2);
      color: inherit;
    }
    .status-action:hover {
      background: rgba(60, 120, 220, 0.35);
    }
    .build-status {
      position: relative;
      z-index: 2;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 13px;
      line-height: 1.7;

    function errorText(err) {
      if (!err) return '未知错误';
      if (typeof err === 'string') return err;
      return err.message || String(err);
    }

    function friendlyError(err) {
      const msg = errorText(err);
      const low = msg.toLowerCase();
      if (low.includes('permission') || low.includes('403') || (low.includes('workflow') && low.includes('token'))) {
        return t('errPermission');
      }
      if (low.includes('not found') || low.includes('404')) {
        return t('errNotFound');
      }
      if (low.includes('timed out') || low.includes('timeout') || low.includes('connection')) {
        return t('errTimeout');
      }
      return msg;
    }

    function invokeWithTimeout(command, args, ms) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error(t('errTimeout')));
          }
        }, ms || 20000);
        invoke(command, args).then(
          res => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve(res);
            }
          },
          err => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              reject(err);
            }
          }
        );
      });
    }

    function invokeWithSlowNotice(command, args, noticeMs, hardMs) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let noticed = false;
        const notice = setTimeout(() => {
          if (!settled && !noticed) {
            noticed = true;
            showStatus(t('githubSlow'), 'info');
          }
        }, noticeMs || 10000);
        const hard = setTimeout(() => {
          if (!settled) {
            settled = true;
            clearTimeout(notice);
            reject(new Error(t('errTimeout')));
          }
        }, hardMs || 120000);
        invoke(command, args).then(
          res => {
            if (!settled) {
              settled = true;
              clearTimeout(notice);
              clearTimeout(hard);
              resolve(res);
            }
          },
          err => {
            if (!settled) {
              settled = true;
              clearTimeout(notice);
              clearTimeout(hard);
              reject(err);
            }
          }
        );
      });
    }

    function showStatus(message, type, duration) {
      const bar = document.getElementById('statusBar');
      const el = document.createElement('div');
      el.className = 'status-msg ' + (type || 'info');
      el.textContent = message;
      let timer = null;
      let remaining = duration || 5000;
      let startedAt = Date.now();

      function clearTimer() {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      }

      function dismiss() {
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 400);
      }

      function arm() {
        clearTimer();
        timer = setTimeout(() => {
          remaining = 0;
          dismiss();
        }, remaining);
      }

      el.addEventListener('mouseenter', () => {
        if (remaining > 0) {
          remaining = Math.max(0, remaining - (Date.now() - startedAt));
          clearTimer();
          if (remaining <= 0) dismiss();
        }
      });
      el.addEventListener('mouseleave', () => {
        if (remaining > 0) {
          startedAt = Date.now();
          arm();
        }
      });
      arm();
      bar.appendChild(el);
      while (bar.children.length > 5) bar.firstChild.remove();
      return el;
    }

    function statusWithAction(message, type, label, handler) {
      const el = showStatus(message, type);
      const btn = document.createElement('button');
      btn.className = 'status-action';
      btn.textContent = label;
      btn.addEventListener('click', handler);
      el.appendChild(btn);
    }

    function persistSettings(tokenOverride) {
      try {
        const token = tokenOverride !== undefined ? tokenOverride : state.gitHubToken;
        localStorage.setItem('wogaer.token', token || '');
        localStorage.setItem('wogaer.lang', state.lang);
        localStorage.setItem('wogaer.theme', state.isDark ? 'dark' : 'light');
        localStorage.setItem('wogaer.client_id', state.clientId || '');
      } catch (e) {
        console.error(e);
      }
    }

    function loadSettings() {
      try {
        const token = localStorage.getItem('wogaer.token') || '';
        const lang = localStorage.getItem('wogaer.lang') || '';
        const theme = localStorage.getItem('wogaer.theme') || '';
        state.clientId = localStorage.getItem('wogaer.client_id') || '';
        if (token) {
          state.gitHubToken = token;
          state.isLoggedIn = true;
          invoke('set_github_token', { token }).catch(e => console.error(e));
          loadUserInfo();
        }
        if (lang) {
          state.lang = lang;
          invoke('set_language', { lang }).catch(e => console.error(e));
        }
        if (theme === 'dark') {
          state.isDark = true;
          document.body.classList.add('dark');
          document.getElementById('themeToggle').textContent = '☀';
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderUser() {
      const avatar = document.getElementById('userAvatar');
      const img = document.getElementById('avatarImg');
      const placeholder = document.getElementById('avatarPlaceholder');
      const menuName = document.getElementById('userMenuName');
      const logoutBtn = document.getElementById('userLogout');

      if (state.userInfo && state.userInfo.avatar_url) {
        img.src = state.userInfo.avatar_url;
        img.hidden = false;
        placeholder.style.display = 'none';
        avatar.title = state.userInfo.name || state.userInfo.login || state.userInfo.name;
      } else {
        img.hidden = true;
        placeholder.style.display = '';
        avatar.title = state.isLoggedIn ? '...' : t('clickToLogin');
      }
      menuName.textContent = state.userInfo
        ? t('loggedInAs') + ' ' + (state.userInfo.name || state.userInfo.login)
        : (state.isLoggedIn ? '...' : t('clickToLogin'));
      logoutBtn.hidden = !state.isLoggedIn;
      document.getElementById('userMenu').hidden = true;
    }

    async function loadUserInfo() {
      if (!state.isLoggedIn) {
        state.userInfo = null;
        renderUser();
        return;
      }
      try {
        const info = await invokeWithSlowNotice('get_github_user', {}, 8000, 60000);
        state.userInfo = info;
      } catch (e) {
        console.error('Load GitHub user failed:', e);
        state.userInfo = null;
        const msg = errorText(e);
        if (/401|403|bad credentials|unauthorized/i.test(msg)) {
          state.gitHubToken = null;
          state.isLoggedIn = false;
          localStorage.removeItem('wogaer.token');
          invoke('github_logout').catch(err => console.error(err));
          showStatus(t('sessionExpired'), 'error');
          updateUI();
        } else {
          showStatus(t('userLoadFailed') + ': ' + msg, 'error');
        }
      }
      renderUser();
    }

    async function logoutUser() {
      try {
        await invoke('github_logout');
      } catch (e) {
        console.error(e);
      }
      state.gitHubToken = null;
      state.isLoggedIn = false;
      state.userInfo = null;
      localStorage.removeItem('wogaer.token');
      persistSettings();
      document.getElementById('settingsTokenInput').value = '';
      document.getElementById('userMenu').hidden = true;
      renderUser();
      updateUI();
      showStatus(t('loggedOut'), 'success');
    }

    const deviceState = { timer: null, code: null, clientId: '', interval: 5, verifyUrl: '' };

    function stopDeviceFlow() {
      if (deviceState.timer) {
        clearTimeout(deviceState.timer);
        deviceState.timer = null;
      }
      deviceState.code = null;
      deviceState.clientId = '';
      deviceState.verifyUrl = '';
      document.getElementById('deviceFlow').hidden = true;
      document.getElementById('deviceStatusText').textContent = '';
    }

    async function startDeviceFlow() {
      const clientId = document.getElementById('settingsClientIdInput').value.trim();
      if (!clientId) {
        showSettingsError(t('clientIdRequired'));
        return;
      }
      stopDeviceFlow();
      document.getElementById('settingsError').hidden = true;
      try {
        const info = await invokeWithSlowNotice('device_flow_start', { clientId }, 8000, 30000);
        state.clientId = clientId;
        localStorage.setItem('wogaer.client_id', clientId);
        deviceState.code = info.device_code;
        deviceState.clientId = clientId;
        deviceState.verifyUrl = info.verification_uri || 'https://github.com/login/device';
        deviceState.interval = Math.max(5, info.interval || 5);
        document.getElementById('deviceFlowText').textContent = t('deviceFlowHint');
        document.getElementById('deviceCodeText').textContent = info.user_code || '';
        document.getElementById('deviceFlow').hidden = false;
        document.getElementById('deviceStatusText').textContent = t('deviceWaiting');
        deviceState.timer = setTimeout(pollDeviceFlow, deviceState.interval * 1000);
      } catch (e) {
        showSettingsError(errorText(e));
      }
    }

    async function pollDeviceFlow() {
      deviceState.timer = null;
      if (!deviceState.code || !deviceState.clientId) return;
      try {
        const res = await invokeWithSlowNotice('device_flow_poll', {
          clientId: deviceState.clientId,
          deviceCode: deviceState.code,
        }, 8000, 30000);
        if (res.status === 'ok') {
          stopDeviceFlow();
          document.getElementById('settingsError').hidden = true;
          document.getElementById('settingsTokenInput').value = res.token;
          const ok = await githubLogin(res.token);
          if (ok) {
            document.getElementById('settingsTokenInput').value = '';
            persistSettings();
            closeSettings();
          }
          return;
        }
        if (res.status === 'denied') {
          stopDeviceFlow();
          showSettingsError(t('deviceDenied'));
          return;
        }
        if (res.status === 'expired') {
          stopDeviceFlow();
          showSettingsError(t('deviceExpired'));
          return;
        }
        if (res.status === 'error') {
          stopDeviceFlow();
          showSettingsError(errorText(res.error || res));
          return;
        }
        deviceState.interval = Math.max(5, res.interval || deviceState.interval);
        document.getElementById('deviceStatusText').textContent = t('deviceWaiting');
        deviceState.timer = setTimeout(pollDeviceFlow, deviceState.interval * 1000);
      } catch (e) {
        stopDeviceFlow();
        showSettingsError(errorText(e));
      }
    }

    async function analyzeProject(path) {
      try {
        const result = await invoke('analyze_project', { projectPath: path });
        console.log(result);
        state.projectInfo = result;
        state.repoOwner = result.repo_owner || null;
        state.repoName = result.repo_name || null;
        state.branch = result.current_branch || 'main';
        if (result.is_git_repo) {
          document.getElementById('dropHint').textContent = path + ' (Git, branch: ' + state.branch + ')';
          if (result.languages.length > 0) {
            const lang = result.languages[0];
            const name = state.repoName || path.split(/[\\/]/).pop() || 'project';
            try {
              const workflowPath = await invoke('generate_workflow', {
                projectPath: path,
                language: lang,
                projectName: name,
              });
              console.log('Workflow generated:', workflowPath);
              document.getElementById('dropHint').textContent = path + ' (workflow: build.yml)';
              showStatus(t('workflowGenerated'), 'success');
            } catch (e) {
              console.error('Generate workflow error:', e);
              document.getElementById('dropHint').textContent = path + ' (workflow 生成失败: ' + e + ')';
              showStatus(t('workflowFailed') + ': ' + errorText(e), 'error');
            }
          } else {
            document.getElementById('dropHint').textContent = path + ' (未检测到支持的语言，跳过 workflow)';
            showStatus(t('noLangSkipped'), 'info');
          }
        } else {
          document.getElementById('dropHint').textContent = path + ' (不是 Git 仓库，跳过 workflow)';
          showStatus(t('notGitSkipped'), 'info');
        }
      } catch (e) {
        console.error(e);
        document.getElementById('dropHint').textContent = '分析失败: ' + e;
        showStatus(t('opFailed') + ': ' + errorText(e), 'error');
      }
    }

    async function githubLogin(token) {
      try {
        const ok = await invokeWithSlowNotice('github_login', { token }, 8000, 60000);
        if (ok) {
          state.isLoggedIn = true;
          state.gitHubToken = token;
          persistSettings();
          loadUserInfo();
          showStatus(t('loginSuccess'), 'success');
          return true;
        }
        showSettingsError(t('loginError'));
        showStatus(t('loginError'), 'error');
        return false;
      } catch (e) {
        console.error(e);
        const msg = friendlyError(e);
        showSettingsError(t('loginError') + ': ' + msg);
        showStatus(t('loginError') + ': ' + msg, 'error');
        return false;
      }
    }

    let pendingLoginToken = null;

    function validateTokenInBackground(token) {
      if (!token) return;
      if (pendingLoginToken && pendingLoginToken === token) {
        showStatus(t('loginVerifying'), 'info');
        return;
      }
      pendingLoginToken = token;
      showStatus(t('loginVerifying'), 'info');
      invokeWithSlowNotice('github_login', { token }, 8000, 60000).then(ok => {
        pendingLoginToken = null;
        if (ok) {
          state.isLoggedIn = true;
          state.gitHubToken = token;
          persistSettings();
          loadUserInfo();
          showStatus(t('loginSuccess'), 'success');
        } else {
          showStatus(t('loginError'), 'error');
        }
      }).catch(e => {
        pendingLoginToken = null;
        const msg = friendlyError(e);
        showStatus(t('loginError') + ': ' + msg, 'error');
      });
    }

    function showSettingsError(message) {
      const el = document.getElementById('settingsError');
      el.textContent = message;
      el.hidden = false;
    }

    const BUILD_PHASES = [
      { key: 'queued', labelKey: 'phaseQueued' },
      { key: 'setup', labelKey: 'phaseSetup' },
      { key: 'checkout', labelKey: 'phaseCheckout' },
      { key: 'build', labelKey: 'phaseBuild' },
      { key: 'upload', labelKey: 'phaseUpload' },
    ];

    function switchTab(name) {
      state.activeTab = name;
      document.getElementById('tabProject').classList.toggle('active', name === 'project');
      document.getElementById('tabBuild').classList.toggle('active', name === 'build');
      document.getElementById('tabHistory').classList.toggle('active', name === 'history');
      document.getElementById('panelProject').hidden = name !== 'project';
      document.getElementById('panelBuild').hidden = name !== 'build';
      document.getElementById('panelHistory').hidden = name !== 'history';
      if (name === 'build') renderBuildPanel();
      if (name === 'history') refreshHistory();
    }

    function formatElapsed(seconds) {
      const total = Math.max(0, Math.floor(seconds));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
    }

    function renderBuildMeta() {
      const meta = document.getElementById('buildMeta');
      if (!meta) return;
      if (state.buildTriggering) {
        meta.textContent = t('triggeringBuild');
        return;
      }
      if (!state.lastRunId) {
        meta.textContent = t('buildMetaIdle');
        return;
      }
      let text = 'Run ' + state.lastRunId;
      if (state.buildStartTime) {
        text += ' · ' + t('elapsedPrefix') + ' ' + formatElapsed((Date.now() - state.buildStartTime) / 1000);
      }
      meta.textContent = text;
    }

    function startBuildElapsed() {
      stopBuildElapsed();
      state.buildStartTime = Date.now();
      renderBuildMeta();
      state.buildElapsedTimer = setInterval(renderBuildMeta, 1000);
    }

    function stopBuildElapsed() {
      if (state.buildElapsedTimer) {
        clearInterval(state.buildElapsedTimer);
        state.buildElapsedTimer = null;
      }
    }

    function logBuild(message, type) {
      state.buildLogs.push({ time: new Date().toLocaleTimeString(), text: message, type: type || 'info' });
      if (state.buildLogs.length > 8) state.buildLogs.shift();
      renderBuildLogs();
    }

    function renderBuildLogs() {
      const container = document.getElementById('buildLogs');
      if (!container) return;
      if (!state.buildLogs.length) {
        container.innerHTML = '<div class="empty-hint">' + t('noBuildLogs') + '</div>';
        return;
      }
      container.innerHTML = '';
      state.buildLogs.forEach(log => {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = '<span class="log-dot ' + log.type + '"></span><span class="log-time">' + log.time + '</span><span>' + log.text + '</span>';
        container.appendChild(line);
      });
      container.scrollTop = container.scrollHeight;
    }

    function renderBuildBars(status, conclusion) {
      const container = document.getElementById('buildBars');
      if (!container) return;
      const running = status === 'queued' || status === 'in_progress' || status === 'pending';
      const succeeded = status === 'completed' && conclusion === 'success';
      const failed = (status === 'completed' && conclusion !== 'success') || status === 'cancelled';
      container.innerHTML = '';
      BUILD_PHASES.forEach((phase, idx) => {
        const row = document.createElement('div');
        row.className = 'thermo-row';
        const label = document.createElement('span');
        label.className = 'thermo-label';
        label.textContent = t(phase.labelKey);
        const bulb = document.createElement('div');
        bulb.className = 'thermo-bulb';
        const track = document.createElement('div');
        track.className = 'thermo-track';
        const fill = document.createElement('div');
        fill.className = 'thermo-fill';

        if (running) {
          const runIndex = (status === 'queued' || status === 'pending') ? 0 : 1;
          if (idx < runIndex) {
            fill.classList.add('done');
            bulb.classList.add('lit');
          } else if (idx === runIndex) {
            fill.classList.add('run');
            bulb.classList.add('lit');
          }
        } else if (succeeded) {
          fill.classList.add('done');
          bulb.classList.add('lit');
        } else if (failed && idx === 0) {
          fill.classList.add('error');
          fill.style.width = '100%';
          bulb.classList.add('error-lit');
        }

        track.appendChild(fill);
        row.appendChild(label);
        row.appendChild(bulb);
        row.appendChild(track);
        container.appendChild(row);
      });
    }

    function renderBuildPanel() {
      renderBuildMeta();
      renderBuildLogs();
      if (state.lastStatus) {
        renderBuildBars(state.lastStatus, state.lastConclusion);
      }
    }

    async function loadBuildArtifacts() {
      const container = document.getElementById('buildArtifacts');
      if (!container) return;
      if (!state.lastRunId || !state.repoOwner || !state.repoName) return;
      if (!state.isLoggedIn) {
        container.innerHTML = '<div class="empty-hint">' + t('loginRequired') + '</div>';
        return;
      }
      container.innerHTML = '<div class="empty-hint">加载中...</div>';
      try {
        const artifacts = await invokeWithSlowNotice('get_artifacts', {
          runId: state.lastRunId,
          repoOwner: state.repoOwner,
          repoName: state.repoName,
        }, 8000, 30000);
        state.lastBuildArtifacts = artifacts;
        renderArtifacts(
          container,
          { run_id: state.lastRunId, repo_name: state.repoOwner + '/' + state.repoName },
          artifacts,
          state.repoOwner,
          state.repoName
        );
      } catch (e) {
        container.innerHTML = '<div class="empty-hint">' + errorText(e) + '</div>';
        showStatus(errorText(e), 'error');
      }
    }

    async function refreshHistory() {
      const tbody = document.getElementById('historyTableBody');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="empty-hint">加载中...</td></tr>';
      try {
        const result = await invokeWithSlowNotice('get_build_history', { limit: 20 }, 8000, 30000);
        state.historyRecords = result.records || [];
        renderHistoryTable();
      } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="5" class="empty-hint">' + t('historyLoadFailed') + ': ' + errorText(e) + '</td></tr>';
        showStatus(t('historyLoadFailed') + ': ' + errorText(e), 'error');
      }
    }

    function renderHistoryTable() {
      const tbody = document.getElementById('historyTableBody');
      const records = state.historyRecords;
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-hint">' + t('historyEmpty') + '</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      records.forEach(record => {
        const repo = record.repo_name || '-';
        const statusClass = String(record.status || '').toLowerCase();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${repo}</td>
          <td>${record.created_at || '-'}</td>
          <td><span class="status-chip status-${statusClass}">${record.status || '-'}</span></td>
          <td id="count-${record.id}">-</td>
          <td>
            <div class="row-actions">
              <button class="table-btn">${t('viewArtifacts')}</button>
              <button class="table-btn">${t('openGithub')}</button>
            </div>
          </td>
        `;
        const [owner, name] = repo.split('/');
        const btns = tr.querySelectorAll('.table-btn');
        btns[0].addEventListener('click', () => toggleHistoryArtifacts(record, tr));
        btns[1].addEventListener('click', () => {
          const url = record.run_id
            ? 'https://github.com/' + repo + '/actions/runs/' + record.run_id
            : 'https://github.com/' + repo;
          invoke('open_url', { url }).catch(e => showStatus(errorText(e), 'error'));
        });
        tbody.appendChild(tr);
        if (record.run_id && owner && name && state.isLoggedIn) {
          loadArtifactCount(record, owner, name);
        }
      });
    }

    async function loadArtifactCount(record, owner, name) {
      try {
        const artifacts = await invokeWithSlowNotice('get_artifacts', {
          runId: record.run_id,
          repoOwner: owner,
          repoName: name,
        }, 8000, 30000);
        const cell = document.getElementById('count-' + record.id);
        if (cell) cell.textContent = String(artifacts.length);
      } catch (e) {
        const cell = document.getElementById('count-' + record.id);
        if (cell) cell.textContent = '-';
      }
    }

    function toggleHistoryArtifacts(record, tr) {
      const existing = document.getElementById('detail-' + record.id);
      if (existing) {
        existing.remove();
        return;
      }
      const detail = document.createElement('tr');
      detail.className = 'artifact-detail-row';
      detail.id = 'detail-' + record.id;
      detail.innerHTML = '<td colspan="5"><div class="artifact-list" id="artifacts-' + record.id + '"></div></td>';
      tr.after(detail);
      viewArtifacts(record);
    }

    async function triggerBuild() {
      if (!state.isLoggedIn) {
        showStatus(t('loginRequired'), 'error');
        openSettings();
        return;
      }
      if (!state.projectPath) {
        showStatus(t('projectRequired'), 'error');
        return;
      }
      if (!state.repoOwner || !state.repoName) {
        showStatus(t('repoInfoMissing'), 'error');
        return;
      }
      const btn = document.getElementById('btnBuild');
      const btnText = document.getElementById('btnBuildText');
      btn.disabled = true;
      btnText.textContent = t('triggering');
      state.lastRunId = null;
      state.lastStatus = 'queued';
      state.lastConclusion = null;
      state.buildTriggering = true;
      state.buildStartTime = null;
      state.buildLogs = [];
      state.lastBuildArtifacts = [];
      document.getElementById('buildStatus').hidden = false;
      document.getElementById('buildStatusText').textContent = t('triggeringBuild');
      document.getElementById('buildChip').textContent = t('triggering');
      renderBuildBars('queued', null);
      renderBuildMeta();
      logBuild(t('triggeringBuild'), 'info');
      switchTab('build');
      try {
        const request = {
          repo_owner: state.repoOwner,
          repo_name: state.repoName,
          workflow_id: 'build.yml',
          ref_name: state.branch || 'main',
          inputs: {},
          project_path: state.projectPath,
        };
        const result = await invokeWithSlowNotice('trigger_build', { request }, 10000, 90000);
        console.log(result);
        state.buildTriggering = false;
        state.lastRunId = result.run_id;
        state.lastStatus = result.status || 'queued';
        state.lastConclusion = null;
        showBuildStatus(result);
        startStatusPolling();
        startBuildElapsed();
        logBuild(t('buildLogTriggered') + ' · Run ' + result.run_id, 'info');
        showStatus(t('buildTriggered') + ' · Run ID: ' + result.run_id, 'success');
      } catch (e) {
        console.error(e);
        state.buildTriggering = false;
        stopBuildElapsed();
        renderBuildMeta();
        document.getElementById('buildStatus').hidden = false;
        document.getElementById('buildStatusText').textContent = t('buildFailed') + ': ' + friendlyError(e);
        document.getElementById('buildChip').textContent = t('statusFailed');
        logBuild(t('buildLogFailed') + ': ' + friendlyError(e), 'error');
        showStatus(friendlyError(e), 'error');
      } finally {
        btn.disabled = false;
        btnText.textContent = t('btnBuild');
      }
    }

    function showBuildStatus(info) {
      document.getElementById('buildStatus').hidden = false;
      document.getElementById('buildStatusText').textContent = t('statusLabel') + ': ' + info.status;
      document.getElementById('buildChip').textContent = info.status;
      const link = document.getElementById('buildStatusLink');
      if (info.html_url) {
        link.href = info.html_url;
        link.hidden = false;
      } else {
        link.hidden = true;
      }
      const prev = state.lastStatus;
      state.lastStatus = info.status;
      state.lastConclusion = info.conclusion || null;
      renderBuildBars(info.status, info.conclusion);
      renderBuildMeta();
      if (prev !== info.status && info.status) {
        logBuild(t('statusLabel') + ': ' + info.status, info.status === 'completed' ? 'success' : 'info');
      }
    }

    function startStatusPolling() {
      stopStatusPolling();
      state.pollErrors = 0;
      state.statusTimer = setInterval(refreshBuildStatus, 4000);
    }

    function stopStatusPolling() {
      if (state.statusTimer) {
        clearInterval(state.statusTimer);
        state.statusTimer = null;
      }
    }

    async function refreshBuildStatus() {
      if (!state.lastRunId || !state.repoOwner || !state.repoName) return;
      try {
        const info = await invokeWithSlowNotice('get_build_status', {
          runId: state.lastRunId,
          repoOwner: state.repoOwner,
          repoName: state.repoName,
        }, 10000, 45000);
        state.pollErrors = 0;
        showBuildStatus(info);
        if (info.status === 'completed') {
          stopStatusPolling();
          stopBuildElapsed();
          renderBuildMeta();
          const ok = info.conclusion === 'success';
          logBuild(ok ? t('buildLogCompleted') : t('buildLogFailed') + ' · ' + (info.conclusion || ''), ok ? 'success' : 'error');
          showStatus(t('buildCompleted') + (ok ? '' : ' · ' + (info.conclusion || '')), ok ? 'success' : 'error');
          loadBuildArtifacts();
        } else if (info.status === 'cancelled') {
          stopStatusPolling();
          stopBuildElapsed();
          renderBuildMeta();
          logBuild(t('buildLogCancelled'), 'error');
          showStatus(t('buildCancelled'), 'error');
        }
      } catch (e) {
        console.error(e);
        state.pollErrors = (state.pollErrors || 0) + 1;
        if (state.pollErrors >= 3) {
          stopStatusPolling();
          stopBuildElapsed();
          renderBuildMeta();
          showStatus(friendlyError(e), 'error');
        }
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      return value.toFixed(value >= 100 ? 0 : 1) + ' ' + units[unit];
    }

    async function viewArtifacts(record) {
      const container = document.getElementById('artifacts-' + record.id);
      if (!container) return;
      const [owner, name] = (record.repo_name || '').split('/');
      if (!record.run_id || !owner || !name) {
        container.innerHTML = '<div class="empty-hint">' + t('noArtifacts') + '</div>';
        return;
      }
      if (!state.isLoggedIn) {
        container.innerHTML = '<div class="empty-hint">' + t('loginRequired') + '</div>';
        return;
      }
      container.innerHTML = '<div class="empty-hint">加载中...</div>';
      try {
        const artifacts = await invokeWithSlowNotice('get_artifacts', {
          runId: record.run_id,
          repoOwner: owner,
          repoName: name,
        }, 8000, 30000);
        renderArtifacts(container, record, artifacts, owner, name);
      } catch (e) {
        container.innerHTML = '<div class="empty-hint">' + e + '</div>';
        showStatus(errorText(e), 'error');
      }
    }

    function renderArtifacts(container, record, artifacts, owner, name) {
      if (!artifacts.length) {
        container.innerHTML = '<div class="empty-hint">' + t('noArtifacts') + '</div>';
        return;
      }
      container.innerHTML = '';
      artifacts.forEach(art => {
        const row = document.createElement('div');
        row.className = 'artifact-row';
        row.innerHTML = `
          <div class="artifact-info">
            <span>${art.name} (${formatBytes(art.size)})</span>
            <div class="progress-track"><div class="progress-fill" id="dl-fill-${art.id}"></div></div>
            <span class="history-item-meta" id="dl-status-${art.id}"></span>
          </div>
          <button class="download-btn">${t('download')}</button>
        `;
        row.querySelector('.download-btn').addEventListener('click', () => downloadArtifact(record, art, owner, name, row));
        container.appendChild(row);
      });
    }

    async function downloadArtifact(record, artifact, owner, name, row) {
      if (!state.isLoggedIn) {
        showStatus(t('loginRequired'), 'error');
        return;
      }
      const btn = row.querySelector('.download-btn');
      btn.disabled = true;
      const fill = document.getElementById('dl-fill-' + artifact.id);
      const statusEl = document.getElementById('dl-status-' + artifact.id);
      fill.style.width = '0%';
      statusEl.textContent = t('downloadStarted');
      try {
        if (!state.downloadDir) {
          state.downloadDir = await invoke('get_download_dir');
        }
        const result = await invoke('download_artifacts', {
          request: {
            artifact_ids: [artifact.id],
            dest_dir: state.downloadDir,
            run_id: record.run_id,
            repo_owner: owner,
            repo_name: name,
          },
        });
        const saved = (result && result[0]) || state.downloadDir;
        fill.style.width = '100%';
        statusEl.textContent = t('downloadComplete') + ': ' + saved;
        document.getElementById('dropHint').textContent = t('downloadComplete') + ': ' + saved;
        btn.textContent = t('done');
        statusWithAction(t('downloadSaved') + ': ' + saved, 'success', t('openFolder'), () => {
          invoke('reveal_path', { path: saved }).catch(err => {
            showStatus(errorText(err), 'error');
          });
        });
      } catch (e) {
        console.error(e);
        statusEl.textContent = t('downloadFailed') + ': ' + errorText(e);
        btn.disabled = false;
        showStatus(friendlyError(e), 'error');
      }
    }

    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsTokenInput = document.getElementById('settingsTokenInput');
    const settingsLangSelect = document.getElementById('settingsLangSelect');
    const settingsClientIdInput = document.getElementById('settingsClientIdInput');

    function openSettings() {
      settingsTokenInput.value = '';
      settingsLangSelect.value = state.lang;
      settingsClientIdInput.value = state.clientId || '';
      stopDeviceFlow();
      document.getElementById('settingsError').hidden = true;
      document.getElementById('settingsProgress').hidden = true;
      document.getElementById('settingsSave').disabled = false;
      const hint = document.getElementById('settingsLoginHint');
      if (state.isLoggedIn) {
        hint.hidden = false;
        hint.textContent = state.userInfo
          ? t('loggedInAs') + ' ' + (state.userInfo.name || state.userInfo.login)
          : t('alreadyLoggedIn');
      } else {
        hint.hidden = true;
      }
      settingsOverlay.classList.add('active');
    }

    function closeSettings() {
      const token = settingsTokenInput.value.trim();
      const lang = settingsLangSelect.value;
      let changed = false;
      if (lang !== state.lang) {
        state.lang = lang;
        invoke('set_language', { lang }).catch(e => console.error(e));
        changed = true;
      }
      if (token && token !== state.gitHubToken) {
        persistSettings(token);
        validateTokenInBackground(token);
        changed = true;
      }
      if (changed) {
        updateUI();
        showStatus(t('settingsAutoSaved'), 'success');
      }
      stopDeviceFlow();
      document.getElementById('settingsProgress').hidden = true;
      settingsOverlay.classList.remove('active');
    }

    function showSettingsProgress(message) {
      document.getElementById('settingsProgressText').textContent = message || t('loggingIn');
      document.getElementById('settingsProgress').hidden = false;
    }

    function hideSettingsProgress() {
      document.getElementById('settingsProgress').hidden = true;
    }

    function saveSettings() {
      const token = settingsTokenInput.value.trim();
      const lang = settingsLangSelect.value;
      if (lang !== state.lang) {
        state.lang = lang;
        invoke('set_language', { lang }).catch(e => console.error(e));
        updateUI();
      }
      if (token && token !== state.gitHubToken) {
        persistSettings(token);
        validateTokenInBackground(token);
      } else {
        persistSettings();
        if (token && token === state.gitHubToken) {
          loadUserInfo();
        }
      }
      settingsTokenInput.value = '';
      showStatus(t('settingsSaved'), 'success');
      closeSettings();
    }

    listen('download-progress', (event) => {
      const payload = event.payload || {};
      const fill = document.getElementById('dl-fill-' + payload.artifact_id);
      const statusEl = document.getElementById('dl-status-' + payload.artifact_id);
      if (fill) fill.style.width = Math.min(100, payload.progress || 0) + '%';
      if (statusEl && payload.downloaded != null && payload.total != null) {
        statusEl.textContent = formatBytes(payload.downloaded) + ' / ' + formatBytes(payload.total) + ' (' + Math.round(payload.progress || 0) + '%)';
      }
      console.log(payload);
    }).catch(e => console.error(e));

    document.getElementById('langToggle').addEventListener('click', () => {
      const next = state.lang === 'zh' ? 'en' : 'zh';
      setLanguage(next);
    });

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('btnPick').addEventListener('click', pickProject);
    document.getElementById('btnSettings').addEventListener('click', openSettings);
    document.getElementById('btnHistory').addEventListener('click', () => switchTab('history'));
    document.getElementById('btnBuild').addEventListener('click', triggerBuild);
    document.getElementById('tabProject').addEventListener('click', () => switchTab('project'));
    document.getElementById('tabBuild').addEventListener('click', () => switchTab('build'));
    document.getElementById('tabHistory').addEventListener('click', () => switchTab('history'));
    document.getElementById('tabRefresh').addEventListener('click', () => {
      if (state.activeTab === 'build') refreshBuildStatus();
      else if (state.activeTab === 'history') refreshHistory();
      else showStatus(t('projectSelected'), 'info');
    });
    document.getElementById('userAvatar').addEventListener('click', () => {
      const menu = document.getElementById('userMenu');
      if (state.isLoggedIn) {
        menu.hidden = !menu.hidden;
      } else {
        openSettings();
        settingsTokenInput.focus();
      }
    });
    document.getElementById('userLogout').addEventListener('click', logoutUser);
    document.getElementById('settingsClose').addEventListener('click', closeSettings);
    document.getElementById('settingsSave').addEventListener('click', saveSettings);
    document.getElementById('deviceLoginBtn').addEventListener('click', startDeviceFlow);
    document.getElementById('generateTokenBtn').addEventListener('click', () => {
      invoke('open_url', {
        url: 'https://github.com/settings/tokens/new?scopes=workflow&description=woGAer',
      }).catch(e => showStatus(errorText(e), 'error'));
    });
    document.getElementById('advancedToggle').addEventListener('click', () => {
      const body = document.getElementById('advancedBody');
      body.hidden = !body.hidden;
      document.getElementById('advancedToggle').textContent = body.hidden ? t('advancedLogin') : t('advancedHide');
    });
    document.getElementById('openVerifyBtn').addEventListener('click', () => {
      if (deviceState.verifyUrl) {
        invoke('open_url', { url: deviceState.verifyUrl }).catch(e => {
          showStatus(errorText(e), 'error');
        });
      }
    });
    document.getElementById('cancelDeviceBtn').addEventListener('click', () => {
      stopDeviceFlow();
      showStatus(t('deviceCancelled'), 'info');
    });

    settingsOverlay.addEventListener('click', (e) => {
      if (e.target === settingsOverlay) closeSettings();
    });

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('userMenu');
      if (!menu.hidden && !e.target.closest('#userMenu') && !e.target.closest('#userAvatar')) {
        menu.hidden = true;
      }
    });

    loadSettings();
    renderUser();
    if (!localStorage.getItem('wogaer.lang')) {
      invoke('get_current_language').then(lang => {
        state.lang = lang || 'zh';
        updateUI();
      }).catch(e => {
        console.error(e);
        state.lang = 'zh';
        updateUI();
      });
    } else {
      updateUI();
    }

    console.log('woGAer UI ready');
  </script>

              for (var key in style) { bloom.style[key] = style[key]; }
            },
            setRimStyle: function(style) {
              rim.style.width = width + 'px';
              rim.style.height = height + 'px';
              for (var key in style) { rim.style[key] = style[key]; }
            },
            setFaceOverlay: function(faces) {
              edgeSvg.replaceChildren();
              for (var i = 0; i < faces.length; i++) {
                var face = faces[i];
                var polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygon.setAttribute('points', face.points.map(function(p) { return p.x.toFixed(2) + ',' + p.y.toFixed(
                  2); }).join(' '));
                polygon.setAttribute('fill', 'rgba(188, 232, 247, ' + face.fillOpacity.toFixed(3) + ')');
                polygon.setAttribute('stroke', 'rgba(126, 176, 198, ' + face.strokeOpacity.toFixed(3) + ')');
                polygon.setAttribute('stroke-width', '1');
                polygon.setAttribute('stroke-linejoin', 'round');
                polygon.setAttribute('vector-effect', 'non-scaling-stroke');
                edgeSvg.appendChild(polygon);
              }
            },
            mount: function(parent) {
              parent.appendChild(svg);
              parent.appendChild(root);
            },
            destroy: function() {
              if (raf) cancelAnimationFrame(raf);
              svg.remove();
              root.remove();
            }
          };
        }

        function attachLiquidPyramid(options) {
          var opts = Object.assign({
            parent: document.body,
            debug: false,
            width: BASE_W,
            height: BASE_H,
          }, options || {});
          var parent = opts.parent;
          var mount = document.createElement('div');
          mount.style.position = 'absolute';
          mount.style.inset = '0';
          mount.style.pointerEvents = 'none';
          mount.style.zIndex = '0';
          mount.style.borderRadius = '60px';
          mount.style.overflow = 'hidden';
          parent.appendChild(mount);
          var interactionLayer = document.createElement('div');
          interactionLayer.style.position = 'absolute';
          interactionLayer.style.inset = '0';
          interactionLayer.style.pointerEvents = 'none';
          mount.appendChild(interactionLayer);
          var shader = createShader(opts.width, opts.height, { debug: opts.debug });
          var host = document.createElement('div');
          host.style.position = 'absolute';
          host.style.left = '50%';
          host.style.top = '50%';
          host.style.width = opts.width + 'px';
          host.style.height = opts.height + 'px';
          host.style.pointerEvents = 'none';
          host.style.cursor = 'default';
          host.style.touchAction = 'none';
          interactionLayer.appendChild(host);
          shader.mount(host);
          var x = 0,
            y = 0,
            vx = 0,
            vy = 0;
          var theta = 0.64,
            phi = -0.42;
          var animFrame = 0;

          function updateTransform() {
            host.style.transform = 'translate(-50%, -50%) translate(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px)';
            theta = 0.64 + x * THETA_PER_PX;
            phi = clamp(-0.42 - y * PHI_PER_PX, PHI_MIN, PHI_MAX);
            var context = createPyramidContext(theta, phi);
            var centerX = (context.hullCenter.x / opts.width) * 100;
            var centerY = (context.hullCenter.y / opts.height) * 100;
            var topX = (context.bloomAnchors.top.x / opts.width) * 100;
            var topY = (context.bloomAnchors.top.y / opts.height) * 100;
            var leftX = (context.bloomAnchors.lowerLeft.x / opts.width) * 100;
            var leftY = (context.bloomAnchors.lowerLeft.y / opts.height) * 100;
            var rightX = (context.bloomAnchors.lowerRight.x / opts.width) * 100;
            var rightY = (context.bloomAnchors.lowerRight.y / opts.height) * 100;
            var bloomScaleX = Math.max((context.hullBounds.width / opts.width) * 100, 68);
            var bloomScaleY = Math.max((context.hullBounds.height / opts.height) * 100, 78);
            shader.setBloomStyle({
              clipPath: context.clipPath,
              opacity: '1',
              transform: 'scale(1.03)',
              transformOrigin: centerX + '% ' + centerY + '%',
              filter: 'blur(30px) saturate(1.3) brightness(1.22)',
              background: 'radial-gradient(' + bloomScaleX * 0.2 + '% ' + bloomScaleY * 0.24 + '% at ' + topX + '% ' +
                topY +
                '%, rgba(255, 255, 255, 0.98), rgba(186, 244, 255, 0.68) 34%, rgba(108, 224, 255, 0.2) 62%, rgba(108, 224, 255, 0) 100%), ' +
                'radial-gradient(' + bloomScaleX * 0.18 + '% ' + bloomScaleY * 0.2 + '% at ' + leftX + '% ' + leftY +
                '%, rgba(214, 247, 255, 0.58), rgba(110, 221, 255, 0.24) 48%, rgba(110, 221, 255, 0) 100%), ' +
                'radial-gradient(' + bloomScaleX * 0.16 + '% ' + bloomScaleY * 0.18 + '% at ' + rightX + '% ' + rightY +
                '%, rgba(208, 244, 255, 0.34), rgba(110, 221, 255, 0.14) 50%, rgba(110, 221, 255, 0) 100%), ' +
                'radial-gradient(' + bloomScaleX * 0.44 + '% ' + bloomScaleY * 0.32 + '% at ' + centerX + '% ' + Math
                .max(centerY - 8, 12) + '%, rgba(160, 236, 255, 0.22), rgba(160, 236, 255, 0.08) 54%, rgba(160, 236, 255, 0) 100%)'
            });
            shader.setRimStyle({
              clipPath: context.clipPath,
              opacity: '0.45',
              background: 'linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(205, 246, 255, 0.18) 42%, rgba(255, 255, 255, 0.04) 78%, rgba(255, 255, 255, 0.24))',
              filter: 'drop-shadow(0 0 6px rgba(170, 240, 255, 0.45)) drop-shadow(0 0 14px rgba(122, 225, 255, 0.18))'
            });
            shader.setFaceOverlay(context.projectedFaces);
            shader.setStyle({
              clipPath: context.clipPath,
              background: 'linear-gradient(140deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03) 38%, rgba(255, 255, 255, 0.1) 68%, rgba(255, 255, 255, 0.18)), linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05))'
            });
            shader.setFragment(function(uv) {
              var trace = tracePyramidRay(uv, context);
              if (!trace) return texture(uv.x, uv.y);
              var bulged = applyEdgeBulge(trace, uv, context);
              return texture(bulged.displacedUv.x, bulged.displacedUv.y);
            });
          }

          function tick() {
            animFrame = 0;
            updateTransform();
          }

          function scheduleTick() { if (!animFrame) animFrame = requestAnimationFrame(tick); }
          scheduleTick();
          window.addEventListener('resize', function() {});
          return {
            element: mount,
            destroy: function() {
              if (animFrame) cancelAnimationFrame(animFrame);
              shader.destroy();
              mount.remove();
            }
          };
        }
        window.attachLiquidPyramid = attachLiquidPyramid;
        var pyramid = attachLiquidPyramid({
          parent: document.getElementById('pyramid-host'),
          width: BASE_W,
          height: BASE_H,
          debug: false
        });
        window.pyramidInstance = pyramid;
      })();

      (function() {
        function smoothStep(a, b, t) {
          t = Math.max(0, Math.min(1, (t - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }

        function length(x, y) { return Math.hypot(x, y); }

        function roundedRectSDF(x, y, w, h, r) {
          var qx = Math.abs(x) - w + r;
          var qy = Math.abs(y) - h + r;
          return Math.min(Math.max(qx, qy), 0) + length(Math.max(qx, 0), Math.max(qy, 0)) - r;
        }

        function texture(x, y) { return { type: 't', x: x, y: y }; }

        function generateId() { return 'btn-glass-' + Math.random().toString(36).substr(2, 9); }
        var ButtonGlass = function(options) {
          options = options || {};
          this.width = options.width || 100;
          this.height = options.height || 40;
          this.container = options.container || document.body;
          this.fragment = options.fragment || function(uv, mouse) {
            var ix = uv.x - 0.5;
            var iy = uv.y - 0.5;
            var dist = roundedRectSDF(ix, iy, 0.45, 0.25, 0.6);
            var disp = smoothStep(0.8, 0, dist - 0.15);
            var scaled = smoothStep(0, 1, disp);
            var strength = 0.35;
            var mx = mouse.x - 0.5;
            var my = mouse.y - 0.5;
            var influence = 1 - smoothStep(0.1, 0.4, Math.hypot(mx, my));
            var effective = scaled * strength * (0.5 + 0.5 * influence);
            return texture(ix * effective * 1.2 + 0.5, iy * effective * 1.2 + 0.5);
          };
          this.canvasDPI = 1;
          this.id = generateId();
          this.mouse = { x: 0.5, y: 0.5 };
          this.mouseUsed = false;
          this.createElement();
          this.setupEventListeners();
          this.updateShader();
        };
        ButtonGlass.prototype.createElement = function() {
          this.wrapper = document.createElement('div');
          this.wrapper.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:inherit;overflow:hidden;';
          this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          this.svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          this.svg.setAttribute('width', '0');
          this.svg.setAttribute('height', '0');
          this.svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:5;';
          var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
          var filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
          filter.setAttribute('id', this.id + '_filter');
          filter.setAttribute('filterUnits', 'userSpaceOnUse');
          filter.setAttribute('color-interpolation-filters', 'sRGB');
          filter.setAttribute('x', '0');
          filter.setAttribute('y', '0');
          filter.setAttribute('width', String(this.width));
          filter.setAttribute('height', String(this.height));
          this.feImage = document.createElementNS('http://www.w3.org/2000/svg', 'feImage');
          this.feImage.setAttribute('id', this.id + '_map');
          this.feImage.setAttribute('width', String(this.width));
          this.feImage.setAttribute('height', String(this.height));
          this.feDisplacementMap = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
          this.feDisplacementMap.setAttribute('in', 'SourceGraphic');
          this.feDisplacementMap.setAttribute('in2', this.id + '_map');
          this.feDisplacementMap.setAttribute('xChannelSelector', 'R');
          this.feDisplacementMap.setAttribute('yChannelSelector', 'G');
          filter.appendChild(this.feImage);
          filter.appendChild(this.feDisplacementMap);
          defs.appendChild(filter);
          this.svg.appendChild(defs);
          this.canvas = document.createElement('canvas');
          this.canvas.width = this.width * this.canvasDPI;
          this.canvas.height = this.height * this.canvasDPI;
          this.canvas.style.display = 'none';
          this.context = this.canvas.getContext('2d');
        };
        ButtonGlass.prototype.setupEventListeners = function() {
          var self = this;

          function onMove(e) {
            var rect = self.wrapper.getBoundingClientRect();
            self.mouse.x = (e.clientX - rect.left) / rect.width;
            self.mouse.y = (e.clientY - rect.top) / rect.height;
            self.mouseUsed = true;
            self.updateShader();
          }
          this.wrapper.addEventListener('mousemove', onMove);
          this.wrapper.addEventListener('mouseenter', function() { self.mouseUsed = true; });
          this.wrapper.addEventListener('mouseleave', function() {
            self.mouseUsed = false;
            self.mouse.x = 0.5;
            self.mouse.y = 0.5;
            self.updateShader();
          });
        };
        ButtonGlass.prototype.updateShader = function() {
          var self = this;
          var mouseProxy = new Proxy(this.mouse, {
            get: function(target, prop) {
              if (prop === 'x' || prop === 'y') self.mouseUsed = true;
              return target[prop];
            }
          });
          var w = this.canvas.width,
            h = this.canvas.height;
          var data = new Uint8ClampedArray(w * h * 4);
          var maxScale = 0;
          var rawValues = [];
          for (var i = 0; i < data.length; i += 4) {
            var x = (i / 4) % w;
            var y = Math.floor(i / 4 / w);
            var pos = this.fragment({ x: x / w, y: y / h }, mouseProxy);
            var dx = pos.x * w - x;
            var dy = pos.y * h - y;
            if (Math.abs(dx) > maxScale) maxScale = Math.abs(dx);
            if (Math.abs(dy) > maxScale) maxScale = Math.abs(dy);
            rawValues.push(dx, dy);
          }
          maxScale = Math.max(maxScale, 0.1);
          var idx = 0;
          for (var j = 0; j < data.length; j += 4) {
            var r = rawValues[idx++] / (maxScale * 2) + 0.5;
            var g = rawValues[idx++] / (maxScale * 2) + 0.5;
            data[j] = r * 255;
            data[j + 1] = g * 255;
            data[j + 2] = 0;
            data[j + 3] = 255;
          }
          this.context.putImageData(new ImageData(data, w, h), 0, 0);
          this.feImage.setAttributeNS('http://www.w3.org/1999/xlink', 'href', this.canvas.toDataURL());
          this.feDisplacementMap.setAttribute('scale', String((maxScale * 2) / this.canvasDPI));
        };
        ButtonGlass.prototype.appendTo = function(parent) {
          parent.appendChild(this.svg);
          parent.appendChild(this.wrapper);
        };
        ButtonGlass.prototype.destroy = function() {
          this.svg.remove();
          this.wrapper.remove();
          this.canvas.remove();
        };

        function attachButtonGlass(buttonElement) {
          var rect = buttonElement.getBoundingClientRect();
          var w = rect.width || 100;
          var h = rect.height || 40;
          var glass = new ButtonGlass({
            width: w,
            height: h,
            container: buttonElement,
            fragment: function(uv, mouse) {
              var ix = uv.x - 0.5;
              var iy = uv.y - 0.5;
              var dist = roundedRectSDF(ix, iy, 0.45, 0.25, 0.6);
              var disp = smoothStep(0.8, 0, dist - 0.15);
              var scaled = smoothStep(0, 1, disp);
              var strength = 0.35;
              var mx = mouse.x - 0.5;
              var my = mouse.y - 0.5;
              var influence = 1 - smoothStep(0.1, 0.4, Math.hypot(mx, my));
              var effective = scaled * strength * (0.5 + 0.5 * influence);
              return texture(ix * effective * 1.2 + 0.5, iy * effective * 1.2 + 0.5);
            }
          });
          glass.appendTo(buttonElement);
          return glass;
        }
        window.attachButtonGlass = attachButtonGlass;
        document.querySelectorAll('.btn').forEach(function(btn) {
          var glassEl = btn.querySelector('.btn-glass');
          if (!glassEl) return;
          attachButtonGlass(glassEl);
        });
      })();

      (function() {
        var glass = document.getElementById('glass');
        var isPaused = false;

        function updatePauseState() {
          var paused = document.hidden;
          if (paused !== isPaused) {
            isPaused = paused;
            document.body.classList.toggle('paused', paused);
          }
        }
        document.addEventListener('visibilitychange', updatePauseState);
        updatePauseState();
      })();

      console.log('woGAer liquid glass visuals ready');
    })();
  </script>
