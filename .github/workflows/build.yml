name: Build Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - run: npm ci
    - run: npm run tauri build -- --bundles deb,rpm
    - name: Collect installers
      id: files
      shell: bash
      run: |
        list=$(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.pkg' \) -exec basename {} \; | sort -u)
        json=$(printf '%s\n' "$list" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-ubuntu
        path: src-tauri/target/release/bundle
        if-no-files-found: error

  publish-ubuntu:
    needs: build-ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-ubuntu.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-ubuntu
        path: out
    - name: Move installer
      run: find out -type f -name "${{ matrix.file }}" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - run: npm ci
    - run: npm run tauri build -- --bundles nsis
    - name: Collect installers
      id: files
      shell: bash
      run: |
        list=$(find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -exec basename {} \; | sort -u)
        json=$(printf '%s\n' "$list" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-windows
        path: src-tauri/target/release/bundle
        if-no-files-found: error

  publish-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-windows.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-windows
        path: out
    - name: Move installer
      run: find out -type f -name "${{ matrix.file }}" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - run: npm ci
    - run: npm run tauri build -- --bundles dmg,app
    - name: Create app tarball
      run: |
        mkdir -p tarball
        tar -czf tarball/wogaer-0.1.0-macos-arm64.tar.gz -C src-tauri/target/release/bundle/macos wogaer.app
    - name: Collect installers
      id: files
      shell: bash
      run: |
        list=$(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.pkg' \) -exec basename {} \; | sort -u)
        json=$(printf '%s\n' "$list" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-macos
        path: src-tauri/target/release/bundle
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: wogaer-0.1.0-macos-arm64.tar.gz
        path: tarball/wogaer-0.1.0-macos-arm64.tar.gz
        if-no-files-found: error

  publish-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-macos.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-macos
        path: out
    - name: Move installer
      run: find out -type f -name "${{ matrix.file }}" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error
